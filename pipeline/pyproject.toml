[project]
name = "gps-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "sentence-transformers>=3",
    "llama-index-core>=0.12",
    "llama-index-llms-anthropic>=0.6",
    "openai>=1.60",
    "llama-index-llms-deepseek>=0.1",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gps_engine", "src/gps_core", "src/gps_data", "src/gps_engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
