[project]
name = "gps-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gps_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
